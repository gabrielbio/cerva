<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busca interativa de atos de apoio ao setor cervejeiro</title>
<style>
:root {
  --bg:#fff8ed;
  --card:#ffffff;
  --ink:#2a2118;
  --muted:#6f6257;
  --line:#ead7bd;
  --accent:#b36b00;
  --accent-dark:#7c4a00;
  --chip:#fff0d8;
  --shadow:0 8px 24px rgba(74,42,0,.08);
}
* { box-sizing:border-box; }
body {
  margin:0;
  padding:clamp(12px,2vw,24px);
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#fff4df 0%,#fffaf2 70%);
  color:var(--ink);
}
.container {
  width:min(100%,1320px);
  margin:auto;
}
h1 {
  margin:0 0 8px;
  font-size:clamp(24px,3vw,32px);
  line-height:1.2;
}
.subtitle {
  margin:0 0 18px;
  color:var(--muted);
}
.box {
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-radius:18px;
  padding:clamp(14px,2vw,22px);
  margin-bottom:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.filters {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
  align-items:start;
}
.filters > div {
  min-width:0;
}
label {
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
  color:var(--accent-dark);
  line-height:1.25;
}
input, select, button {
  width:100%;
  max-width:100%;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  font-size:14px;
  background:#fff;
  color:var(--ink);
  line-height:1.25;
}
input:focus, select:focus {
  outline:3px solid rgba(179,107,0,.18);
  border-color:var(--accent);
}
select {
  min-height:42px;
}
select[multiple] {
  height:150px;
  min-height:150px;
  overflow:auto;
}
select:disabled {
  background:#f7efe5;
  color:#7a6b5e;
  cursor:not-allowed;
}
.hint {
  margin-top:5px;
  font-size:12px;
  color:var(--muted);
  line-height:1.35;
}
.actions {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}
button {
  width:auto;
  min-width:140px;
  cursor:pointer;
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  font-weight:700;
}
button.secondary {
  background:#fff;
  color:var(--accent-dark);
  border-color:var(--line);
}
#contador {
  margin:0 0 14px;
  font-weight:700;
  color:var(--accent-dark);
}
.card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:clamp(14px,1.8vw,18px);
  margin-bottom:12px;
  box-shadow:0 4px 16px rgba(74,42,0,.05);
}
.card h3 {
  margin:0 0 8px;
  font-size:18px;
  line-height:1.3;
}
.chips {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:8px 0 12px;
}
.chip {
  background:var(--chip);
  border:1px solid #f2d6a8;
  color:#634000;
  padding:5px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}
.card p {
  line-height:1.45;
}
.details {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:8px 18px;
  margin-top:10px;
  font-size:13px;
  color:var(--muted);
}
.details strong {
  color:var(--ink);
}
a {
  color:var(--accent-dark);
  font-weight:700;
}
.empty {
  padding:28px;
  text-align:center;
  color:var(--muted);
  background:#fff;
  border:1px dashed var(--line);
  border-radius:14px;
}
@media (min-width:900px) {
  .filters > div:first-child {
    grid-column:span 2;
  }
}
@media (max-width:640px) {
  body { padding:10px; }
  .box {
    border-radius:14px;
    padding:14px;
  }
  .filters {
    grid-template-columns:1fr;
    gap:14px;
  }
  .actions {
    flex-direction:column;
  }
  button {
    width:100%;
  }
  select[multiple] {
    height:132px;
    min-height:132px;
  }
  .details {
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>
<div class="container">
  <h1>Busca interativa de atos de apoio ao setor cervejeiro</h1>
  <p class="subtitle">Base com 421 registros incorporados ao arquivo.</p>

  <section class="box">
    <div class="filters" id="filters">
      <div>
        <label for="busca">Busca livre</label>
        <input id="busca" type="search" placeholder="Digite município, número, ementa, apoio, visão geral...">
      </div>

      <div>
        <label>Faixa de ano</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <input id="anoMin" type="number" placeholder="De">
          <input id="anoMax" type="number" placeholder="Até">
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="buscar" type="button">Buscar ato</button>
      <button id="limpar" class="secondary" type="button">Limpar filtros</button>
    </div>
  </section>

  <section class="box">
    <p id="contador"></p>
    <div id="resultados"></div>
  </section>
</div>

, "Ano": "2018", "Dispõe sobre": "Dispões sobre o licenciamento da atividade de microcervejarias artesanais e respectivos bares cervejeiros artesanais no município de União da Vitória", "Data da publicação ou \núltima movimentação": "07/08/2018", "Modelo de negócio apoiado": "Microcervejaria, Nanocervejaria, Brewpub", "Foco": "Planejamento e criação, Comercialização e Distribuição, Implementação e Operação, Patrimônio Cultural e Identidade Cervejeira", "Tipos de apoio": "Simplificação de Licenciamento, Autorização para abertura, Autorização de venda específica, Promoção de Eventos e Feiras, Incentivo ao Turismo Cervejeiro, Selo de Qualidade e Origem, Jurídico e organizacional, Flexibilização de Zoneamento Urbano", "Visão geral": "Regulamenta o licenciamento de microcervejarias em União da Vitória, com limite produtivo baixo, autorização de instalação ampla, venda em eventos e áreas públicas, e criação de selo para promoção turística e comercial. Considera cerveja artesanal aquela produção em estabelecmento com produção de até 2500 L/mês e sem geração de ruídos, trepidações, etc. Caracterizada com ode pequeno porte, baixo risco e impacto ambiental, podendo ser intalada em todo território, exceto nas áreas residenciais exclusivas. Instituí o selo “Cervejas Artesanais do Vale do Iguaçu”. Estimulam-se também os eventos cervejeiros.", "Link": "https://www.legislador.com.br/LegisladorWEB.ASP?WCI=LeiTexto&ID=12&inEspecieLei=1&nrLei=4761&aaLei=2018&dsVerbete=microcervejaria"}, {"Esfera": "Municipal", "UF": "PR", "Região Geográfica  Intermediária (Municipal) |  Grande região (Estadual)": "Guarapuava", "Região Geográfica Imediata (Municipal)": "Guarapuava", "Procedência": "Guarapuava", "Tipo": "Lei ordinária", "Número": "2765", "Ano": "2017", "Dispõe sobre": "Dispõe sobre a criação do Programa de Incentivo às Microcervejarias Artesanais no âmbito do Município de Guarapuava e dá outras providências.", "Data da publicação ou \núltima movimentação": "25/09/2018", "Modelo de negócio apoiado": "Microcervejaria, Nanocervejaria, Brewpub", "Foco": "Comercialização e Distribuição, Produção e Qualidade, Geral, Planejamento e criação, Instalação e Infraestrutura, Implementação e Operação, Manutenção e Sustentabilidade, Expansão", "Tipos de apoio": "Incentivos Fiscais, Infraestrutura, Isenção de taxas municipais, Jurídico e organizacional, Promoção de Eventos e Feiras, Proteção e Valorização Cultural, Selo de Qualidade e Origem, Simplificação de Licenciamento, Apoio à Pesquisa e Inovação", "Visão geral": "Cria programa de incentivo às microcervejarias em Guarapuava, com benefícios fiscais, simplificação de licenciamento, cessão de espaços e equipamentos públicos, apoio a associações, capacitação, certificação e estímulo ao turismo cervejeiro. Define como microcervejaria artesanal a pessoa jurídica com produção de cerveja e chope de até100 mil litros anuais. Prevê isenções parciais de IPTU e taxas, uso de imóveis e equipamentos públicos, criação do selo “Cerveja Artesanal de Guarapuava” e da CERVAFEST.", "Link": "http://leismunicipa.is/qfzei"}, {"Esfera": "Municipal", "UF": "PR", "Região Geográfica  Intermediária (Municipal) |  Grande região (Estadual)": "Guarapuava", "Região Geográfica Imediata (Municipal)": "Guarapuava", "Procedência": "Guarapuava", "Tipo": "Lei ordinária", "Número": "2876", "Ano": "2018", "Dispõe sobre": "Altera a Lei Municipal nº 2765, de 22 de dezembro de 2017, que dispõe sobre a criação do Programa de Incentivo às Microcervejarias Artesanais no âmbito do Município de Guarapuava e dá outras providências.", "Data da publicação ou \núltima movimentação": "25/09/2018", "Modelo de negócio apoiado": "Microcervejaria, Nanocervejaria, Brewpub", "Foco": "Comercialização e Distribuição, Produção e Qualidade, Geral", "Tipos de apoio": "Incentivos Fiscais, Infraestrutura, Isenção de taxas municipais, Jurídico e organizacional, Promoção de Eventos e Feiras, Proteção e Valorização Cultural, Simplificação de Licenciamento", "Visão geral": "A õe sobre o fomento do turismo local através do Incentivo à Produção de Cerveja Artesanal e sua comercialização no âmbito do Município de Umuarama, e dá outras providências.", "Data da publicação ou \núltima movimentação": "18/04/2019", "Modelo de negócio apoiado": "Microcervejaria, Nanocervejaria, Brewpub, Caseiro", "Foco": "Comercialização e Distribuição, Produção e Qualidade, Implementação e Operação", "Tipos de apoio": "Jurídico e organizacional, Selo de Qualidade e Origem, Incentivo ao Turismo Cervejeiro, Capacitação e Qualificação, Incentivo ao Consumo Local, Promoção de Eventos e Feiras", "Visão geral": "Institui política de incentivo à cerveja artesanal em Umuarama, articulando produção, turismo e comercialização, com definição de categorias, estímulo à qualificação, certificação, sustentabilidade e venda em eventos. Estabelece estabelecendo três categorias de produtores: microcervejarias artesanais, com limite de até 30 mil litros mensais ou 360 mil litros anuais; cervejeiros caseiros, restritos a 1.200 litros anuais sem caráter comercial; e brewpubs, que podem produzir até 15 mil litros mensais ou 180 mil litros anuais, com venda exclusiva no próprio local. Prevê a criação de um selo oficial de origem.", "Link": "http://leismunicipa.is/nhxqo"}, {"Esfera": "Municipal", "UF": "RJ", "Região Geográfica  Intermediária (Municipal) |  Grande região (Estadual)": "Campos dos Goytacazes", "Região Geográfica Imediata (Municipal)": "Campos dos Goytacazes", "Procedência": "Campos dos Goytacazes", "Tipo": "Lei ordinária", "Número": "8869", "Ano": "2018", "Dispõe sobre": "Dispõe sobre o licenciamento e a criação do programa de incentivo às microcervejarias artesanais no âmbito do município de Campos dos Goytacazes e dá outras providências.", "Data da publicação ou \núltima movimentação": "06/12/2018", "Modelo de negócio apoiado": "Microcervejaria, Nanocervejaria, Brewpub", "Foco": "Planejamento e criação, Implementação e Operação, Produção e Qualidade, Comercialização e D function normalizar(valor) {
  return String(valor || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function separarValores(valor) {
  return String(valor || '')
    .split(/[,;|]/)
    .map(v => v.trim())
    .filter(Boolean);
}

      separarValores(valor).forEach(v => valores.add(v));
    } else if (String(valor).trim()) {
      valores.add(String(valor).trim());
    }
  });
  return Array.from(valores).sort((a, b) => a.localeCompare(b, 'pt-BR'));
}

function criarOpcao(valor, texto) {
  const opt = document.createElement('option');
  opt.value = valor;
  opt.textContent = texto;
  return opt;
}

function criarFiltros() {
  const area = document.getElementById('filters');

  FILTROS.forEach(filtro => {
    const bloco = document.createElement('div');

    const label = document.createElement('label');
    label.htmlFor = filtro.id;
    label.textContent = filtro.label;

    const select = document.createElement('select');
    select.id = filtro.id;

    if (filtro.multiple) {
      select.multiple = true;
      select.size = 6;
      select.appendChild(criarOpcao('', 'Todos'));
    } else {
      select.appendChild(criarOpcao('', filtro.id === 'uf' ? 'Todas' : 'Todos'));
    }

    let opcoes = valoresUnicos(filtro.column, filtro.multiple);
    if (filtro.id === 'modelo') {
      opcoes = MODELOS_PERMITIDOS;
    }

    opcoes.forEach(valor => select.appendChild(criarOpcao(valor, valor)));

    bloco.appendChild(label);
    bloco.appendChild(select);

    if (filtro.multiple) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = 'Use Ctrl ou Cmd para selecionar mais de uma opção.';
      bloco.appendChild(hint);
    }

    area.appendChild(bloco);
  });
}

function repopularSelect(id, valores, rotuloTodos) {
  const el = document.getElementById(id);
  if (!el) return;

  const anterior = el.value;
  el.innerHTML = '';
  el.appendChild(criarOpcao('', rotuloTodos));

  valores.forEach(v => {
    if (String(v || '').trim()) {
      el.appendChild(criarOpcao(v, v));
    }
  });

  if (Array.from(el.options).some(o => o.value === anterior)) {
    el.value = anterior;
  }
}

function atualizarFiltrosGeograficos() {
  const esferaEl = document.getElementById('esfera');
  const ufEl = document.getElementById('uf');
  const procEl = document.getElementById('procedencia');

  if (!esferaEl || !ufEl || !procEl || !COL_ESFERA || !COL_UF || !COL_PROC) return;

  const esfera = normalizar(esferaEl.value);

  if (esfera === 'federal') {
    ufEl.disabled = true;
    repopularSelect('uf', ['Não se aplica'], 'Todas');
    ufEl.value = 'Não se aplica';

    procEl.disabled = true;
    repopularSelect('procedencia', ['União'], 'Todos');
    procEl.value = 'União';
    return;
  }

  if (esfera === 'estadual') {
    ufEl.disabled = true;
    repopularSelect('uf', [], 'Todas');
    ufEl.value = '';

    procEl.disabled = false;
    const estados = valoresUnicos(COL_PROC, false, LEIS.filter(x => normalizar(x[COL_ESFERA]) === 'estadual'));
    repopularSelect('procedencia', estados, 'Todos');
    return;
  }

  if (esfera === 'municipal') {
    ufEl.disabled = false;
    procEl.disabled = false;

    const baseMunicipal = LEIS.filter(x => normalizar(x[COL_ESFERA]) === 'municipal');
    const ufAnterior = ufEl.value;

    const ufs = valoresUnicos(COL_UF, false, baseMunicipal)
      .filter(v => normalizar(v) !== 'nao se aplica');

    repopularSelect('uf', ufs, 'Todas');

    if (ufs.includes(ufAnterior)) {
      ufEl.value = ufAnterior;
    }

    const baseProcedencia = ufEl.value
      ? baseMunicipal.filter(x => normalizar(x[COL_UF]) === normalizar(ufEl.value))
      : baseMunicipal;

    const municipios = valoresUnicos(COL_PROC, false, baseProcedencia);
    repopularSelect('procedencia', municipios, 'Todos');
    return;
  }

  ufEl.disabled = false;
  procEl.disabled = false;
  repopularSelect('uf', valoresUnicos(COL_UF), 'Todas');
  repopularSelect('procedencia', valoresUnicos(COL_PROC), 'Todos');
}

function selecionados(id) {
  const el = document.getElementById(id);
  if (!el) return [];
  if (el.multiple) {
    return Array.from(el.selectedOptions).map(o => o.value).filter(v => v !== '');
  }
  return el.value ? [el.value] : [];
}

function passaFiltro(item, filtro) {
  const valores = selecionados(filtro.id);
  if (!valores.length) return true;

  if (filtro.multiple) {
    const termos = separarValores(item[filtro.column]).map(normalizar);
    const texto = normalizar(item[filtro.column]);
    return valores.some(v => termos.includes(normalizar(v)) || texto.includes(normalizar(v)));
  }

  return valores.some(v => normalizar(item[filtro.column]) === normalizar(v));
}

function anoDoItem(item) {
  if (!COL_ANO) return null;
  const m = String(item[COL_ANO] || '').match(/(19|20)\d{2}/);
  return m ? parseInt(m[0], 10) : null;
}

function filtrar() {
  const busca = normalizar(document.getElementById('busca').value);
  const anoMin = parseInt(document.getElementById('anoMin').value || '', 10);
  const anoMax = parseInt(document.getElementById('anoMax').value || '', 10);

  return LEIS.filter(item => {
    if (busca && !normalizar(Object.values(item).join(' ')).includes(busca)) return false;

    for (const filtro of FILTROS) {
      if (!passaFiltro(item, filtro)) return false;
    }

    const ano = anoDoItem(item);
    if (!Number.isNaN(anoMin) && (ano === null || ano < anoMin)) return false;
    if (!Number.isNaN(anoMax) && (ano === null || ano > anoMax)) return false;

    return true;
  });
}

function esc(valor) {
  return String(valor || '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

function tituloAto(item) {
  const tipo = item[COL_TIPO] || 'Ato';
  const numero = item[COL_NUMERO] ? ' nº ' + item[COL_NUMERO] : '';
  const ano = item[COL_ANO] ? '/' + item[COL_ANO] : '';
  return tipo + numero + ano;
}

function card(item) {
  const chips = FILTROS
    .filter(f => !f.multiple && item[f.column])
    .map(f => `<span class="chip">${esc(item[f.column])}</span>`)
    .join('');

  const detalhesFiltros = FILTROS
    .filter(f => f.multiple && item[f.column])
    .map(f => `<div><strong>${esc(f.label)}:</strong> ${esc(item[f.column])}</div>`)
    .join('');

  const usadas = [COL_TIPO, COL_NUMERO, COL_ANO, COL_DISPOE, COL_VISAO, COL_LINK, ...FILTROS.map(f => f.column)];
  const outros = COLUNAS
    .filter(c => !usadas.includes(c))
    .filter(c => item[c])
    .map(c => `<div><strong>${esc(c)}:</strong> ${esc(item[c])}</div>`)
    .join('');

  const link = item[COL_LINK]
    ? `<div><a href="${esc(item[COL_LINK])}" target="_blank" rel="noopener">Abrir ato</a></div>`
    : '';

  return `
    <article class="card">
      <h3>${esc(tituloAto(item))}</h3>
      <div class="chips">${chips}</div>
      ${item[COL_DISPOE] ? `<p><strong>${esc(COL_DISPOE)}:</strong> ${esc(item[COL_DISPOE])}</p>` : ''}
      ${item[COL_VISAO] ? `<p><strong>${esc(COL_VISAO)}:</strong> ${esc(item[COL_VISAO])}</p>` : ''}
      <div class="details">
        ${detalhesFiltros}
        ${outros}
        ${link}
      </div>
    </article>
  `;
}

function renderizar() {
  const lista = filtrar();
  document.getElementById('contador').textContent = `${lista.length} ato(s) encontrado(s) de ${LEIS.length}.`;
  document.getElementById('resultados').innerHTML = lista.length
    ? lista.map(card).join('')
    : '<div class="empty">Nenhum ato encontrado.</div>';
}

function limparFiltros() {
  document.getElementById('busca').value = '';
  document.getElementById('anoMin').value = '';
  document.getElementById('anoMax').value = '';

  FILTROS.forEach(f => {
    const el = document.getElementById(f.id);
    if (!el) return;
    Array.from(el.options).forEach(o => o.selected = false);
    if (!el.multiple) el.value = '';
    el.disabled = false;
  });

  atualizarFiltrosGeograficos();
  renderizar();
}

document.addEventListener('DOMContentLoaded', () => {
  criarFiltros();
  atualizarFiltrosGeograficos();

  document.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('change', () => {
      if (el.id === 'esfera' || el.id === 'uf') {
        atualizarFiltrosGeograficos();
      }
      renderizar();
    });
    el.addEventListener('input', renderizar);
  });

  document.getElementById('buscar').addEventListener('click', renderizar);
  document.getElementById('limpar').addEventListener('click', limparFiltros);

  renderizar();
});
</script>
</body>
